spring:
  application:
    name: arabic-reference
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:arabic_reference}
    username: ${DB_USERNAME:arabic_reference}
    password: ${DB_PASSWORD:local-dev-only}
    hikari:
      pool-name: arabic-reference
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:local-dev-only}
      timeout: 2s
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  admin:
    jwt-secret: ${ADMIN_JWT_SECRET:local-dev-only-admin-jwt-secret-key-32b}
    access-token-ttl: ${ADMIN_ACCESS_TOKEN_TTL:10m}
    refresh-token-ttl: ${ADMIN_REFRESH_TOKEN_TTL:14d}
    max-failed-attempts: ${ADMIN_MAX_FAILED_ATTEMPTS:5}
    lockout-duration: ${ADMIN_LOCKOUT_DURATION:15m}
    rate-limit:
      login: ${ADMIN_LOGIN_RATE_LIMIT:10}
      refresh: ${ADMIN_REFRESH_RATE_LIMIT:30}
      window: ${ADMIN_AUTH_RATE_WINDOW:1m}
    bootstrap:
      username: ${BOOTSTRAP_OWNER_USERNAME:}
      email: ${BOOTSTRAP_OWNER_EMAIL:}
      display-name: ${BOOTSTRAP_OWNER_DISPLAY_NAME:}
      password: ${BOOTSTRAP_OWNER_PASSWORD:}
  search:
    rate-limit-per-minute: ${SEARCH_RATE_LIMIT:600}
  morphology:
    max-candidates: ${MORPHOLOGY_MAX_CANDIDATES:8}
    max-input-length: ${MORPHOLOGY_MAX_INPUT_LENGTH:80}
    rate-limit-per-minute: ${MORPHOLOGY_RATE_LIMIT:120}
    cache-ttl: ${MORPHOLOGY_CACHE_TTL:10m}
  tools:
    rate-limit-per-minute: ${TOOLS_RATE_LIMIT:90}
    cache-ttl: ${TOOLS_CACHE_TTL:10m}
    graph-depth: ${TOOLS_GRAPH_DEPTH:2}
    graph-nodes: ${TOOLS_GRAPH_NODES:50}
    candidate-cap: ${TOOLS_CANDIDATE_CAP:8}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    io.lettuce: WARN
